<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xmux Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <div class="login-box">
        <div class="login-mark">xm</div>
        <h1>xmux</h1>
        <p class="login-subtitle">管理后台</p>

        <div class="login-tabs" id="loginTabs">
          <button class="login-tab active" type="button" data-tab="login">登录</button>
          <button class="login-tab" type="button" data-tab="register">注册</button>
        </div>

        <form id="loginForm" class="login-pane active" data-pane="login">
          <label for="usernameInput">账号</label>
          <input id="usernameInput" autocomplete="username" placeholder="用户名或邮箱" />
          <label for="passwordInput">密码</label>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="云端账号密码" />
          <div class="login-actions">
            <button id="loginButton" type="submit">进入后台</button>
            <button id="googleLoginButton" class="secondary google-button" type="button" hidden>使用 Google 登录</button>
          </div>
          <div class="login-aux">
            <a href="#" class="login-link" data-tab="forgot">忘记密码？</a>
          </div>
          <p id="loginMessage" class="login-message"></p>
        </form>

        <form id="registerForm" class="login-pane" data-pane="register" hidden>
          <label for="regUsername">账号</label>
          <input id="regUsername" autocomplete="username" placeholder="用户名" />
          <label for="regEmail">邮箱</label>
          <div class="email-row">
            <input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" />
            <button id="regSendCodeButton" class="secondary" type="button">发送验证码</button>
          </div>
          <label for="regCode">验证码</label>
          <input id="regCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位数字验证码" />
          <label for="regPassword">密码</label>
          <input id="regPassword" type="password" autocomplete="new-password" placeholder="按策略设置" />
          <div class="login-actions">
            <button type="submit">注册</button>
          </div>
          <p id="regMessage" class="login-message"></p>
        </form>

        <form id="forgotForm" class="login-pane" data-pane="forgot" hidden>
          <label for="forgotEmail">邮箱</label>
          <input id="forgotEmail" type="email" autocomplete="email" placeholder="注册时使用的邮箱" />
          <div class="login-actions">
            <button type="submit">发送重置链接</button>
          </div>
          <div class="login-aux">
            <a href="#" class="login-link" data-tab="login">返回登录</a>
          </div>
          <p id="forgotMessage" class="login-message"></p>
        </form>
      </div>
    </main>
    <script src="../shared/path.js"></script>
    <script src="login.js"></script>
  </body>
</html>
