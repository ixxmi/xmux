<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud Terminal Admin</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <form id="loginForm" class="login-box">
        <div class="login-mark">CT</div>
        <h1>Admin Access</h1>
        <p class="login-subtitle">Cloud Terminal 控制台</p>
        <label for="adminToken">Admin token</label>
        <input id="adminToken" type="password" autocomplete="current-password" placeholder="Enter admin token" />
        <button type="submit">Open Admin</button>
        <p id="loginMessage" class="login-message"></p>
      </form>
    </main>
    <script src="/admin/login.js"></script>
  </body>
</html>
