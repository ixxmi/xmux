<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重置密码 - xmux</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <form id="resetForm" class="login-box">
        <div class="login-mark">xm</div>
        <h1>设置新密码</h1>
        <p id="resetHint" class="login-hint"></p>
        <label>新密码<input id="newPassword" type="password" autocomplete="new-password" placeholder="按策略设置新密码" /></label>
        <label>确认密码<input id="confirmPassword" type="password" autocomplete="new-password" /></label>
        <div class="login-actions">
          <button type="submit">提交</button>
        </div>
        <p id="resetMessage" class="login-message"></p>
        <p><a class="link-button" href="login.html">返回登录</a></p>
      </form>
    </main>
    <script src="../shared/path.js"></script>
    <script src="reset.js"></script>
  </body>
</html>
