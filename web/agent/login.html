<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xmux Agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <form id="loginForm" class="login-box">
        <div class="login-mark">xm</div>
        <h1>xmux</h1>
        <p class="login-subtitle">Agent 管理</p>
        <p class="cloud-hint" id="cloudHint"></p>
        <label for="usernameInput">账号</label>
        <input id="usernameInput" autocomplete="username" placeholder="云端用户名或邮箱" />
        <label for="passwordInput">密码</label>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="云端账号密码" />
        <button id="loginButton" type="submit">登录</button>
        <p id="loginMessage" class="login-message"></p>
      </form>
    </main>
    <script src="../shared/path.js"></script>
    <script src="login.js"></script>
  </body>
</html>
